name: macos
on:
  workflow_dispatch:
jobs:
  build-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout Luanti 5.13.0
        uses: actions/checkout@v4
        with:
          repository: skylord-at-hub/luanti
          ref: "5.13-fp"
          submodules: recursive
      - name: Install dependencies via Homebrew
        run: |
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew update --auto-update
          brew install \
            cmake \
            ninja \
            freetype \
            gettext \
            gmp \
            hiredis \
            jpeg-turbo \
            jsoncpp \
            leveldb \
            libogg \
            libpng \
            libvorbis \
            luajit \
            zstd \
            sdl2 \
            openal-soft
      - name: Configure (CMake)
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DBUILD_CLIENT=TRUE \
            -DBUILD_SERVER=FALSE \
            -DENABLE_GETTEXT=TRUE \
            -DENABLE_FREETYPE=TRUE \
            -DENABLE_LEVELDB=TRUE \
            -DENABLE_REDIS=TRUE \
            -DENABLE_SOUND=TRUE \
            -DCMAKE_FIND_FRAMEWORK=LAST \
            -DCMAKE_INSTALL_PREFIX="${PWD}/build/macos"
      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)
      - name: Install into .app bundle
        run: cmake --install build
      - name: Codesign for local use
        run: |
          codesign --force --deep -s - \
            --entitlements misc/macos/entitlements/debug.entitlements \
            build/macos/luanti.app
      - name: Run unit tests
        run: |
          mkdir -p "${HOME}/Library/Application Support/minetest/games/"
          ln -s "${PWD}/games/devtest" \
            "${HOME}/Library/Application Support/minetest/games/"
          ./build/macos/luanti.app/Contents/MacOS/luanti --run-unittests
      - name: Package as ZIP
        run: |
          cd build
          cpack -G ZIP -B macos
          cd macos
          for f in *.zip; do
            mv "$f" "${f%.zip}-arm64-tahoe.zip"
          done
      - name: Upload artifact (backup, 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: luanti-5.13.0-macos-arm64-tahoe
          path: ./build/macos/*.zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "5.13.0-macos-arm64"
          name: "Luanti 5.13.0 - macOS Apple Silicon (arm64)"
          body: |
            Luanti (formerly Minetest) **5.13.0** built for **macOS Apple Silicon (arm64)**.
            ### Install
            1. Download the .zip below
            2. Extract and drag luanti.app to your Applications folder
            3. Launch
          files: ./build/macos/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
