name: windows
on:
  workflow_dispatch:
jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout Luanti 5.13-fp
        uses: actions/checkout@v4
        with:
          repository: skylord-at-hub/luanti
          ref: "5.13-fp"
          submodules: recursive

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: powershell

      - name: Install dependencies via vcpkg
        run: |
          .\vcpkg\vcpkg install --triplet x64-windows
        shell: powershell
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows

      - name: Configure (CMake)
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_CLIENT=TRUE `
            -DBUILD_SERVER=FALSE `
            -DENABLE_GETTEXT=TRUE `
            -DENABLE_FREETYPE=TRUE `
            -DENABLE_LEVELDB=TRUE `
            -DENABLE_REDIS=TRUE `
            -DENABLE_SOUND=TRUE `
            -DCMAKE_INSTALL_PREFIX="$PWD/build/windows"
        shell: powershell

      - name: Build
        run: cmake --build build --config Release --parallel
        shell: powershell

      - name: Install
        run: cmake --install build --config Release
        shell: powershell

      - name: Copy runtime DLLs
        run: |
          $src = "$PWD\vcpkg\installed\x64-windows\bin"
          $dst = "$PWD\build\windows\bin"
          New-Item -ItemType Directory -Force -Path $dst
          Copy-Item "$src\*.dll" $dst -Force
        shell: powershell

      - name: Package as ZIP
        run: |
          cd build
          cpack -G ZIP -B windows
          cd windows
          Get-ChildItem -Filter *.zip | Rename-Item -NewName { $_.Name -replace '\.zip$', '-x64-fastplace.zip' }
        shell: powershell

      - name: Upload artifact (backup, 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: luanti-5.13.0-windows-x64-fastplace
          path: ./build/windows/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "5.13.0-windows-x64"
          name: "Luanti 5.13.0 - Windows x64 (fastplace)"
          body: |
            Luanti (formerly Minetest) **5.13.0** built for **Windows x64**.
            ### Install
            1. Download the .zip below
            2. Extract the folder
            3. Run `luanti.exe`
          files: ./build/windows/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}